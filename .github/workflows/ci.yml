name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make setup build
      - run: make test
      - run: make demo
      - name: Benchmark smoke run
        run: MF_BENCH_EVENTS=50000 MF_BENCH_LOOKUPS=2000 make bench

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make setup
      - run: make ${{ matrix.target }}
